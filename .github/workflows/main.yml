```yaml
name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should RDP stay active? (1-5)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:
      - name: Validate Runtime
        shell: pwsh
        run: |
          $hours = 0
          if (-not [int]::TryParse(
              $env:RDP_HOURS, [ref]$hours
          ) -or $hours -lt 1 -or $hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          Write-Host "RDP runtime configured for $hours hour(s)."

      - name: Configure RDP Securely
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          # Allow RDP only from Tailscale IPv4 addresses.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "Set the RDP_PASSWORD repository secret first."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePass
          } else {
              New-LocalUser `
                -Name 'RDP' `
                -Password $securePass `
                -AccountNeverExpires
          }

          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          $members = Get-LocalGroupMember -Group $rdpGroup.Name

          if (-not ($members | Where-Object {
              $_.Name -eq "$env:COMPUTERNAME\RDP"
          })) {
              Add-LocalGroupMember -Group $rdpGroup.Name -Member 'RDP'
          }

          Write-Host "RDP user configured. Password is not printed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installerPath = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          try {
              $process = Start-Process msiexec.exe `
                -ArgumentList @('/i', "`"$installerPath`"", '/quiet', '/norestart') `
                -Wait -PassThru

              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale installation failed: $($process.ExitCode)"
              }
          } finally {
              Remove-Item $installerPath -Force -ErrorAction SilentlyContinue
          }

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $candidate = & $ts ip -4
              if ($LASTEXITCODE -eq 0 -and $candidate) {
                  $tsIP = ($candidate | Select-Object -First 1).Trim()
                  if ($tsIP) { break }
              }
              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IPv4 address: $tsIP"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          $connected = $false

          do {
              $result = Test-NetConnection `
                -ComputerName $env:TAILSCALE_IP `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if ($result.TcpTestSucceeded) {
                  $connected = $true
                  break
              }

              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $connected) {
              throw "RDP port 3389 did not become reachable."
          }

          Write-Host "RDP TCP connectivity verified."

      - name: Maintain Connection Until Deadline
        shell: pwsh
        run: |
          $hours = [int]$env:RDP_HOURS
          $duration = [TimeSpan]::FromHours($hours)
          $stopAt = (Get-Date).Add($duration)

          Write-Host ""
          Write-Host "===== RDP ACCESS ====="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Use the configured RDP_PASSWORD secret"
          Write-Host "Automatic stop: $($stopAt.ToString('yyyy-MM-dd HH:mm:ss'))"
          Write-Host "Runtime: $hours hour(s)"
          Write-Host "======================"

          while ((Get-Date) -lt $stopAt) {
              $remaining = $stopAt - (Get-Date)

              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP active. Remaining: $($remaining.ToString('hh\:mm\:ss'))"

              $sleepSeconds = [Math]::Min(
                  60,
                  [Math]::Max(1, [int][Math]::Ceiling($remaining.TotalSeconds))
              )

              Start-Sleep -Seconds $sleepSeconds
          }

          Write-Host "Configured runtime elapsed. Ending RDP workflow."
```
