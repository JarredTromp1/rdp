name: Temporary Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "How long should the RDP session stay online?"
        required: true
        type: choice
        default: "2"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

concurrency:
  group: temporary-windows-rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rdp:
    # windows-2025 is a GitHub-hosted Windows Server 2025 runner.
    runs-on: windows-2025
    timeout-minutes: 370

    steps:
      - name: Validate required secrets
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          CHROME_URLS: ${{ secrets.CHROME_URLS }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing GitHub Actions secret: TAILSCALE_AUTH_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Missing GitHub Actions secret: RDP_PASSWORD'
          }
          if ([string]::IsNullOrWhiteSpace($env:CHROME_URLS)) {
            throw 'Missing GitHub Actions secret: CHROME_URLS'
          }

          # Require a JSON array containing individual URL strings.
          $parsed = ConvertFrom-Json -InputObject $env:CHROME_URLS -NoEnumerate
          if ($null -eq $parsed -or $parsed -isnot [System.Array] -or $parsed.Count -eq 0) {
            throw 'CHROME_URLS must be a non-empty JSON array of URL strings.'
          }

          foreach ($url in $parsed) {
            if ($url -isnot [string] -or
                $url -notmatch '^https?://' -or
                $url -match '\s') {
              throw "Each CHROME_URLS item must be an HTTP/HTTPS URL without whitespace."
            }
          }

          Write-Host "Validated $($parsed.Count) Chrome tab URL(s)."

      - name: Install and connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi

          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed with exit code $($install.ExitCode)."
          }

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          if (-not (Test-Path $tailscale)) {
            throw 'Tailscale executable was not found after installation.'
          }

          $keyFile = Join-Path $env:ProgramData 'tailscale-authkey.txt'
          Set-Content -Path $keyFile -Value $env:TAILSCALE_AUTH_KEY -NoNewline
          $acl = Get-Acl $keyFile
          $acl.SetAccessRuleProtection($true, $false)
          $system = New-Object System.Security.AccessControl.FileSystemAccessRule('SYSTEM', 'FullControl', 'Allow')
          $admins = New-Object System.Security.AccessControl.FileSystemAccessRule('Administrators', 'FullControl', 'Allow')
          $acl.SetAccessRule($system)
          $acl.SetAccessRule($admins)
          Set-Acl -Path $keyFile -AclObject $acl

          try {
            Start-Service Tailscale
            & $tailscale up "--auth-key=file:$keyFile" --hostname="gh-rdp-$env:GITHUB_RUN_ID" --accept-routes=false
            if ($LASTEXITCODE -ne 0) {
              throw "tailscale up failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

          $status = & $tailscale status
          $status | ForEach-Object { Write-Host $_ }

          $ip = (& $tailscale ip -4 | Select-Object -First 1).Trim()
          if ([string]::IsNullOrWhiteSpace($ip)) {
            throw 'Could not obtain the Tailscale IPv4 address.'
          }

          "TAILSCALE_IPV4=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IPv4: $ip"

      - name: Configure RDP and create the RDP administrator
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Enable Remote Desktop and require Network Level Authentication.
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Create or update the local RDP account. No script-level minimum
          # password length is imposed; Windows account policy still applies.
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $account = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue
          if ($null -eq $account) {
            New-LocalUser -Name 'RDP' -Password $securePassword `
              -FullName 'Temporary RDP Administrator' `
              -Description 'Temporary administrator for this GitHub Actions runner' `
              -PasswordNeverExpires | Out-Null
          }
          else {
            Set-LocalUser -Name 'RDP' -Password $securePassword -PasswordNeverExpires $true
            Enable-LocalUser -Name 'RDP'
          }

          $isAdmin = Get-LocalGroupMember -Group 'Administrators' -ErrorAction Stop |
            Where-Object { $_.Name -match '\\RDP$' -or $_.Name -eq 'RDP' }
          if (-not $isAdmin) {
            Add-LocalGroupMember -Group 'Administrators' -Member 'RDP'
          }

          # Disable broad built-in RDP firewall rules and allow only Tailscale.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          $tailscaleAdapter = Get-NetAdapter |
            Where-Object {
              $_.Status -eq 'Up' -and
              ($_.Name -match 'Tailscale' -or $_.InterfaceDescription -match 'Tailscale')
            } |
            Select-Object -First 1

          if ($null -eq $tailscaleAdapter) {
            throw 'Could not find an active Tailscale network adapter.'
          }

          Remove-NetFirewallRule -DisplayName 'RDP over Tailscale only' -ErrorAction SilentlyContinue
          New-NetFirewallRule `
            -DisplayName 'RDP over Tailscale only' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -InterfaceAlias $tailscaleAdapter.Name `
            -Profile Any | Out-Null

          # Ensure the service is listening before the session wait begins.
          $listener = Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue
          if (-not $listener) {
            Start-Sleep -Seconds 5
            $listener = Get-NetTCPConnection -State Listen -LocalPort 3389 -ErrorAction SilentlyContinue
          }
          if (-not $listener) {
            throw 'RDP is not listening on TCP port 3389.'
          }

          Write-Host "RDP account is ready. Connect to $env:TAILSCALE_IPV4:3389 using username RDP."

      - name: Install Google Chrome and configure individual startup tabs
        shell: pwsh
        env:
          CHROME_URLS: ${{ secrets.CHROME_URLS }}
        run: |
          $ErrorActionPreference = 'Stop'

          $chromeMsi = Join-Path $env:TEMP 'google-chrome-enterprise.msi'
          Invoke-WebRequest `
            -Uri 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi' `
            -OutFile $chromeMsi

          $install = Start-Process msiexec.exe -ArgumentList @('/i', "`"$chromeMsi`"", '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "Chrome installation failed with exit code $($install.ExitCode)."
          }

          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) {
            throw 'Chrome executable was not found after installation.'
          }

          $parsed = ConvertFrom-Json -InputObject $env:CHROME_URLS -NoEnumerate
          if ($parsed -isnot [System.Array] -or $parsed.Count -eq 0) {
            throw 'CHROME_URLS must be a non-empty JSON array.'
          }

          $urls = [System.Collections.Generic.List[string]]::new()
          foreach ($url in $parsed) {
            if ($url -isnot [string] -or $url -notmatch '^https?://' -or $url -match '\s') {
              throw 'CHROME_URLS must contain only HTTP/HTTPS URL strings without whitespace.'
            }
            $urls.Add($url)
          }

          $configDir = Join-Path $env:ProgramData 'RDPChrome'
          New-Item -ItemType Directory -Path $configDir -Force | Out-Null
          $urls.ToArray() | ConvertTo-Json -Compress |
            Set-Content -Path (Join-Path $configDir 'websites.json') -Encoding utf8

          # This launcher runs in the RDP user's interactive desktop session.
          $launcher = @'
          $ErrorActionPreference = 'Stop'
          $config = 'C:\ProgramData\RDPChrome\websites.json'
          $urls = @(Get-Content -Raw -Path $config | ConvertFrom-Json)
          if ($urls.Count -eq 0) { exit 0 }

          $chromeCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          )
          $chrome = $chromeCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $chrome) { throw 'Chrome executable not found.' }

          $profile = Join-Path $env:LOCALAPPDATA 'RDPChromeProfile'
          $arguments = @(
            '--new-window'
            '--no-first-run'
            '--no-default-browser-check'
            ('--user-data-dir="{0}"' -f $profile)
          )
          foreach ($url in $urls) {
            if ($url -is [string] -and $url -match '^https?://') {
              $arguments += $url
            }
          }

          # Chrome opens one browser window with each configured URL in its own tab.
          Start-Process -FilePath $chrome -ArgumentList $arguments
          '@

          $launcherPath = Join-Path $configDir 'Launch-ChromeTabs.ps1'
          Set-Content -Path $launcherPath -Value $launcher -Encoding utf8

          # Give the RDP user read/execute access to the URL configuration.
          $configAcl = Get-Acl $configDir
          $userRule = New-Object System.Security.AccessControl.FileSystemAccessRule(
            "$env:COMPUTERNAME\RDP",
            'ReadAndExecute',
            'ContainerInherit,ObjectInherit',
            'None',
            'Allow'
          )
          $configAcl.SetAccessRule($userRule)
          Set-Acl -Path $configDir -AclObject $configAcl

          $taskName = 'Open configured Chrome tabs for RDP'
          Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue

          $action = New-ScheduledTaskAction `
            -Execute "$PSHOME\pwsh.exe" `
            -Argument "-NoProfile -ExecutionPolicy Bypass -File `"$launcherPath`""
          $trigger = New-ScheduledTaskTrigger -AtLogOn -User "$env:COMPUTERNAME\RDP"
          $principal = New-ScheduledTaskPrincipal `
            -UserId "$env:COMPUTERNAME\RDP" `
            -LogonType Interactive `
            -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries `
            -DontStopIfGoingOnBatteries `
            -StartWhenAvailable

          Register-ScheduledTask -TaskName $taskName -Action $action -Trigger $trigger `
            -Principal $principal -Settings $settings -Force | Out-Null

          Write-Host "Configured $($urls.Count) individual Chrome tab(s) to open when RDP logs in."

      - name: Show connection details
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '=============================================='
          Write-Host '       TEMPORARY WINDOWS RDP IS READY'
          Write-Host '=============================================='
          Write-Host "Tailscale IP : $env:TAILSCALE_IPV4"
          Write-Host 'RDP address  : use the Tailscale IP on port 3389'
          Write-Host 'Username     : RDP'
          Write-Host 'Password     : the value stored in RDP_PASSWORD'
          Write-Host 'Chrome       : configured URLs open as separate tabs after RDP login'
          Write-Host '=============================================='
          Write-Host ''

      - name: Keep RDP session available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $durationHours = [int]'${{ inputs.duration }}'
          $endTime = (Get-Date).AddHours($durationHours)

          Write-Host "RDP will remain configured for $durationHours hour(s), until approximately $endTime."
          while ((Get-Date) -lt $endTime) {
            $remaining = [math]::Ceiling(($endTime - (Get-Date)).TotalMinutes)
            Write-Host "RDP session active. Approximately $remaining minute(s) remaining."
            Start-Sleep -Seconds 60
          }

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Unregister-ScheduledTask -TaskName 'Open configured Chrome tabs for RDP' `
            -Confirm:$false -ErrorAction SilentlyContinue

          Remove-NetFirewallRule -DisplayName 'RDP over Tailscale only' -ErrorAction SilentlyContinue

          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 1 -ErrorAction SilentlyContinue

          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue
          }

          Remove-Item -Path (Join-Path $env:ProgramData 'RDPChrome') `
            -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path (Join-Path $env:ProgramData 'tailscale-authkey.txt') `
            -Force -ErrorAction SilentlyContinue

          $tailscale = 'C:\Program Files\Tailscale\tailscale.exe'
          if (Test-Path $tailscale) {
            & $tailscale down 2>$null
          }

          Write-Host 'Cleanup step completed. The GitHub-hosted runner will be discarded after the job.'
