name: RDP-Bore

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should the session run?"
        required: true
        default: "2"
        type: choice
        options: ["1", "2", "3", "4", "5"]

permissions: {}

jobs:
  rdp-session:
    name: Task
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Execute
        shell: pwsh
        env:
          INPUT_HOURS: ${{ inputs.hours }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          PAYLOAD: ${{ secrets.WIN_PAYLOAD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) { Write-Host "::add-mask::$($env:RDP_PASSWORD)" }
          if ([string]::IsNullOrWhiteSpace($env:PAYLOAD)) { Write-Host "[ERROR] Missing configuration."; exit 1 }
          $log = Join-Path $env:RUNNER_TEMP 'task_exec.log'
          try {
            $script = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:PAYLOAD))
            & ([ScriptBlock]::Create($script))
          } catch {
            Write-Host "[ERROR] Task execution halted unexpectedly:"
            if (Test-Path $log) { Get-Content $log -Tail 50; Remove-Item -Path $log -Force -ErrorAction SilentlyContinue }
            Write-Host $_
            exit 1
          }
