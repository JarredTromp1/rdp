name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should the session run?"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

# Least privilege: the workflow does not need to read or write anything in the repo.
permissions: {}

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    # Only non-secret values at job level. Secrets are scoped to the single step that needs them.
    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:
      - name: Set Runtime Deadline
        shell: pwsh
        run: |
          $hours = 0

          if (-not [int]::TryParse($env:RDP_HOURS, [ref]$hours) -or
              $hours -lt 1 -or $hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          $deadline = [DateTimeOffset]::UtcNow.AddHours($hours)

          "RDP_STOP_UTC=$($deadline.ToString('o'))" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Runtime: $hours hour(s)"
          Write-Host "Deadline UTC: $($deadline.ToString('u'))"

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0 -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2 -Force

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Only allow RDP from the Tailscale CGNAT range.
          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP settings configured."

      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          # Defence in depth: explicitly mask the value in all later log output.
          Write-Host "::add-mask::$($env:RDP_PASSWORD)"

          $securePassword = ConvertTo-SecureString -String $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePassword
          } else {
              New-LocalUser -Name 'RDP' -Password $securePassword -AccountNeverExpires | Out-Null
          }

          net localgroup "Remote Desktop Users" RDP /add | Out-Null
          net localgroup "Administrators" RDP /add | Out-Null
          

          Write-Host "RDP user configured."


      
      
      - name: Configure Chrome Auto-Start and Website Tabs
        shell: pwsh
        env:
          CHROME_URLS: ${{ secrets.CHROME_URLS }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHROME_URLS)) {
              throw "CHROME_URLS secret is missing or empty."
          }

          Write-Host "::add-mask::$($env:CHROME_URLS)"

          # Locate Chrome.
          $chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

          if (-not $chrome) {
              throw "Google Chrome is not installed."
          }

          # Parse URLs: exactly one URL per line.
          $urls = @(
              $env:CHROME_URLS -split '\r?\n' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )

          if ($urls.Count -eq 0) {
              throw "No websites configured."
          }

          # Validate every URL independently.
          $validatedUrls = @()

          foreach ($url in $urls) {
              $parsed = $null

              if ($url -match '\s' -or
                  -not [Uri]::TryCreate(
                      $url,
                      [UriKind]::Absolute,
                      [ref]$parsed
                  ) -or
                  $parsed.Scheme -notin @('https', 'http') -or
                  -not $parsed.Host) {
                  throw "Invalid URL. Configure one complete HTTP/HTTPS URL per line."
              }

              $validatedUrls += $parsed.AbsoluteUri
          }

          # Store launcher configuration.
          $baseDir = Join-Path $env:ProgramData 'RDPChrome'
          New-Item -Path $baseDir -ItemType Directory -Force |
              Out-Null

          $urlFile = Join-Path $baseDir 'websites.json'
          $scriptFile = Join-Path $baseDir 'LaunchChrome.ps1'

          $json = ConvertTo-Json -InputObject $validatedUrls -Depth 3

          [System.IO.File]::WriteAllText(
              $urlFile,
              $json,
              [System.Text.UTF8Encoding]::new($false)
          )

          # Chrome launcher.
          $launcher = @'
          $ErrorActionPreference = 'Stop'

          $chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

          if (-not $chrome) {
              throw "Chrome executable not found."
          }

          $urlFile = "$env:ProgramData\RDPChrome\websites.json"

          $urls = @(
              Get-Content -Path $urlFile -Raw |
              ConvertFrom-Json
          )

          if ($urls.Count -eq 0) {
              throw "No configured websites."
          }

          # Dedicated profile prevents stale browser session restoration.
          $profile = Join-Path $env:LOCALAPPDATA 'RDPChromeProfile'

          New-Item -Path $profile -ItemType Directory -Force |
              Out-Null

          # Launch Chrome exactly once.
          # First URL becomes the first tab.
          # Remaining URLs open in the same window as additional tabs.
          $chromeArgs = @(
              '--new-window'
              '--no-first-run'
              '--no-default-browser-check'
              '--disable-session-crashed-bubble'
              "--user-data-dir=$profile"
          )

          $chromeArgs += $urls

          Start-Process -FilePath $chrome `
              -ArgumentList $chromeArgs

          '@

          [System.IO.File]::WriteAllText(
              $scriptFile,
              $launcher,
              [System.Text.UTF8Encoding]::new($false)
          )

          # Configure interactive RDP logon task.
          $taskName = 'RDP-Chrome-AutoStart'
          $rdpUser = "$env:COMPUTERNAME\RDP"

          $action = New-ScheduledTaskAction `
              -Execute 'powershell.exe' `
              -Argument "-NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$scriptFile`""

          $trigger = New-ScheduledTaskTrigger `
              -AtLogOn `
              -User $rdpUser

          $principal = New-ScheduledTaskPrincipal `
              -UserId $rdpUser `
              -LogonType Interactive `
              -RunLevel Limited

          $settings = New-ScheduledTaskSettingsSet `
              -StartWhenAvailable `
              -ExecutionTimeLimit (New-TimeSpan -Minutes 5) `
              -MultipleInstances IgnoreNew

          Register-ScheduledTask `
              -TaskName $taskName `
              -Action $action `
              -Trigger $trigger `
              -Principal $principal `
              -Settings $settings `
              -Force | Out-Null

          Write-Host "Chrome auto-start configured."
          Write-Host "Number of website tabs: $($validatedUrls.Count)"

          foreach ($url in $validatedUrls) {
              Write-Host "Configured website: $(([Uri]$url).Host)"
          }

          Write-Host "Chrome will launch automatically at RDP login."


      - name: Preinstall uBlock Origin (Chrome and Firefox)
        shell: pwsh
        continue-on-error: true
        run: |
          # ---------- Google Chrome (force-install via policy) ----------
          # Classic uBlock Origin was removed from the Chrome Web Store (Manifest V2 shutdown),
          # so we use uBlock Origin Lite, the official Manifest V3 version.
          $chromeExtId  = 'ddkjiahejlhfcafbddmgiahcphecmpfh'
          $chromeUpdate = 'https://clients2.google.com/service/update2/crx'
          $chromeKey    = 'HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist'

          New-Item -Path $chromeKey -Force | Out-Null
          New-ItemProperty -Path $chromeKey -Name '1' -PropertyType String `
            -Value "$chromeExtId;$chromeUpdate" -Force | Out-Null
          Write-Host "Chrome: uBlock Origin Lite policy set."

          # ---------- Mozilla Firefox (force-install via policies.json) ----------
          $ffDir = @(
            "$env:ProgramFiles\Mozilla Firefox",
            "${env:ProgramFiles(x86)}\Mozilla Firefox"
          ) | Where-Object { Test-Path "$_\firefox.exe" } | Select-Object -First 1

          if ($ffDir) {
              $distDir = Join-Path $ffDir 'distribution'
              New-Item -Path $distDir -ItemType Directory -Force | Out-Null

              $policy = @{
                policies = @{
                  ExtensionSettings = @{
                    'uBlock0@raymondhill.net' = @{
                      installation_mode = 'force_installed'
                      install_url       = 'https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi'
                      private_browsing  = $true
                    }
                  }
                }
              } | ConvertTo-Json -Depth 10

              # Write UTF-8 without BOM so Firefox parses it cleanly.
              [System.IO.File]::WriteAllText(
                (Join-Path $distDir 'policies.json'),
                $policy,
                (New-Object System.Text.UTF8Encoding($false))
              )
              Write-Host "Firefox: uBlock Origin policy set."
          } else {
              Write-Host "Firefox not found on this runner, skipping."
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          $installer = Join-Path $env:RUNNER_TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          try {
              # Verify the installer is signed before running it.
              $sig = Get-AuthenticodeSignature -FilePath $installer
              if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*Tailscale*') {
                  throw "Tailscale installer signature check failed: $($sig.Status)"
              }

              $process = Start-Process msiexec.exe `
                -ArgumentList @('/i', "`"$installer`"", '/quiet', '/norestart') `
                -Wait -PassThru

              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale installation failed: $($process.ExitCode)"
              }
          }
          finally {
              Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              throw "Tailscale executable not found."
          }

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing or empty."
          }

          # Defence in depth: mask the key in all later log output.
          Write-Host "::add-mask::$($env:TS_AUTHKEY)"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $keyFile = Join-Path $env:RUNNER_TEMP 'ts-authkey.txt'

          try {
              # Pass the key via a locked-down temp file (file: syntax) instead of the
              # command line, so it never shows up in process arguments or command echo.
              [System.IO.File]::WriteAllText($keyFile, $env:TS_AUTHKEY.Trim())
              icacls $keyFile /inheritance:r /grant:r "$($env:USERNAME):(R)" | Out-Null

              Set-Service -Name Tailscale -StartupType Automatic
              Start-Service -Name Tailscale
              Start-Sleep -Seconds 5

              # --timeout prevents hanging on an interactive login URL if the key is bad.
              & $ts up `
                "--auth-key=file:$keyFile" `
                "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
                "--unattended" `
                "--timeout=60s" 2>&1 | Out-Null

              if ($LASTEXITCODE -ne 0) {
                  throw "Tailscale connection failed. Check that the auth key is valid, unexpired, reusable and pre-approved."
              }
          }
          finally {
              # Always remove the key from disk and from the process environment.
              Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
              Remove-Item Env:\TS_AUTHKEY -ErrorAction SilentlyContinue
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $output = & $ts ip -4

              if ($LASTEXITCODE -eq 0 -and $output) {
                  $tsIP = "$($output | Select-Object -First 1)".Trim()
                  if ($tsIP) { break }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected. IP: $tsIP"

      - name: Verify Local RDP Listener
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          $listening = $false

          do {
              $listener = Get-NetTCPConnection `
                -State Listen -LocalPort 3389 `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  $listening = $true
                  break
              }

              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $listening) {
              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "Local RDP listener is active."

      - name: Maintain Connection Until Deadline
        shell: pwsh
        run: |
          $stopAt = [DateTimeOffset]::Parse($env:RDP_STOP_UTC)

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Use the RDP_PASSWORD GitHub secret"
          Write-Host "Automatic stop UTC: $($stopAt.ToString('u'))"
          Write-Host "================================"

          while ([DateTimeOffset]::UtcNow -lt $stopAt) {
              $remaining = $stopAt - [DateTimeOffset]::UtcNow

              Write-Host "RDP active. Remaining: $($remaining.ToString('hh\:mm\:ss'))"

              $sleepSeconds = [Math]::Min(60, [Math]::Max(1, [Math]::Ceiling($remaining.TotalSeconds)))

              Start-Sleep -Seconds $sleepSeconds
          }

          Write-Host "Selected runtime reached. Ending workflow."

      # Runs even if an earlier step failed or the job was cancelled.
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Remove-Item (Join-Path $env:RUNNER_TEMP 'ts-authkey.txt') -Force -ErrorAction SilentlyContinue

          if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
          }

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 1 -Force

          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name 'RDP'
          }

          Write-Host "Cleanup complete."
