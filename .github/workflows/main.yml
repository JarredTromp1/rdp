
name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should the session run?"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

# No repository access required.
permissions: {}

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:

      # --------------------------------------------------
      # 1. SET RUNTIME DEADLINE
      # --------------------------------------------------
      - name: Set Runtime Deadline
        shell: pwsh
        run: |
          $hours = 0

          if (-not [int]::TryParse($env:RDP_HOURS, [ref]$hours) -or
              $hours -lt 1 -or $hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          $deadline = [DateTimeOffset]::UtcNow.AddHours($hours)

          "RDP_STOP_UTC=$($deadline.ToString('o'))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Runtime: $hours hour(s)"
          Write-Host "Deadline UTC: $($deadline.ToString('u'))"

      # --------------------------------------------------
      # 2. CONFIGURE RDP AND FIREWALL
      # --------------------------------------------------
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $rdpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          $tcpPath = 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'

          Set-ItemProperty -Path $rdpPath `
              -Name fDenyTSConnections -Value 0 -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty -Path $tcpPath `
              -Name UserAuthentication -Value 1 -Force

          # TLS security layer.
          Set-ItemProperty -Path $tcpPath `
              -Name SecurityLayer -Value 2 -Force

          # Remove old firewall rule.
          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule

          # Allow RDP only through Tailscale CGNAT addresses.
          New-NetFirewallRule `
              -DisplayName 'RDP-Tailscale' `
              -Direction Inbound `
              -Action Allow `
              -Protocol TCP `
              -LocalPort 3389 `
              -RemoteAddress '100.64.0.0/10' `
              -Profile Any | Out-Null

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP configured with NLA and TLS."

      # --------------------------------------------------
      # 3. CREATE RDP ADMINISTRATOR ACCOUNT
      # --------------------------------------------------
      - name: Create RDP Administrator User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          Write-Host "::add-mask::$($env:RDP_PASSWORD)"

          $securePassword = ConvertTo-SecureString `
              -String $env:RDP_PASSWORD `
              -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
              -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePassword
          }
          else {
              New-LocalUser `
                  -Name 'RDP' `
                  -Password $securePassword `
                  -AccountNeverExpires | Out-Null
          }

          # Full local Administrator privileges.
          & net.exe localgroup "Remote Desktop Users" RDP /add
          if ($LASTEXITCODE -ne 0) {
              throw "Could not add RDP to Remote Desktop Users."
          }

          & net.exe localgroup "Administrators" RDP /add
          if ($LASTEXITCODE -ne 0) {
              throw "Could not add RDP to Administrators."
          }

          Write-Host "RDP account created."
          Write-Host "Administrator membership enabled."

      # --------------------------------------------------
      # 4. CHROME AUTO START AND WEBSITE CONFIGURATION
      # --------------------------------------------------
      - name: Configure Chrome Auto-Start and Website Tabs
        shell: pwsh
        env:
          CHROME_URLS: ${{ secrets.CHROME_URLS }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:CHROME_URLS)) {
              throw "CHROME_URLS secret is missing."
          }

          # Locate Chrome.
          $chrome = @(
              "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
              "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } |
              Select-Object -First 1

          if (-not $chrome) {
              throw "Google Chrome is not installed."
          }

          # Parse one URL per line.
          $urls = @(
              $env:CHROME_URLS -split '\r?\n' |
              ForEach-Object { $_.Trim() } |
              Where-Object { $_ }
          )

          if ($urls.Count -eq 0) {
              throw "No website URLs configured."
          }

          # Validate each URL.
          $validated = @()

          foreach ($url in $urls) {
              $parsed = $null

              if ($url -match '\s' -or
                  -not [Uri]::TryCreate(
                      $url,
                      [UriKind]::Absolute,
                      [ref]$parsed
                  ) -or
                  $parsed.Scheme -notin @('https', 'http') -or
                  -not $parsed.Host) {
                  throw "Invalid URL. Use one complete URL per line."
              }

              $validated += $parsed.AbsoluteUri
          }

          # Create configuration directory.
          $baseDir = Join-Path $env:ProgramData 'RDPChrome'

          New-Item -Path $baseDir -ItemType Directory -Force |
              Out-Null

          $scriptFile = Join-Path $baseDir 'LaunchChrome.ps1'

          # Chrome enterprise policies.
          $policyPath = 'HKLM:\SOFTWARE\Policies\Google\Chrome'

          New-Item -Path $policyPath -Force | Out-Null

          # Open configured URLs on browser startup.
          New-ItemProperty -Path $policyPath `
              -Name 'RestoreOnStartup' `
              -PropertyType DWord `
              -Value 4 -Force | Out-Null

          # Suppress first-run account/default-browser prompts.
          New-ItemProperty -Path $policyPath `
              -Name 'BrowserSignin' `
              -PropertyType DWord `
              -Value 0 -Force | Out-Null

          New-ItemProperty -Path $policyPath `
              -Name 'SyncDisabled' `
              -PropertyType DWord `
              -Value 1 -Force | Out-Null

          New-ItemProperty -Path $policyPath `
              -Name 'DefaultBrowserSettingEnabled' `
              -PropertyType DWord `
              -Value 0 -Force | Out-Null

          # Recreate startup URL policy list.
          $urlPolicy = Join-Path $policyPath 'RestoreOnStartupURLs'

          Remove-Item -Path $urlPolicy -Recurse -Force `
              -ErrorAction SilentlyContinue

          New-Item -Path $urlPolicy -Force | Out-Null

          for ($i = 0; $i -lt $validated.Count; $i++) {
              New-ItemProperty -Path $urlPolicy `
                  -Name "$i" `
                  -PropertyType String `
                  -Value $validated[$i] `
                  -Force | Out-Null
          }

          # Create Chrome launcher script.
          $launcher = @'
          $ErrorActionPreference = 'Stop'

          $baseDir = "$env:ProgramData\RDPChrome"
          $logFile = Join-Path $baseDir 'launcher.log'

          function Write-Log($message) {
              Add-Content -Path $logFile `
                  -Value "$(Get-Date -Format o) $message"
          }

          try {
              if ($env:USERNAME -ne 'RDP') {
                  exit 0
              }

              Write-Log "RDP login detected."

              Start-Sleep -Seconds 8

              $chrome = @(
                  "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
                  "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
              ) | Where-Object { $_ -and (Test-Path $_) } |
                  Select-Object -First 1

              if (-not $chrome) {
                  throw "Chrome executable not found."
              }

              $profile = Join-Path $env:LOCALAPPDATA 'RDPChromeProfile'

              New-Item -Path $profile -ItemType Directory -Force |
                  Out-Null

              Write-Log "Starting Chrome."

              $arguments = @(
                  '--new-window'
                  '--no-first-run'
                  '--no-default-browser-check'
                  '--disable-session-crashed-bubble'
                  "--user-data-dir=$profile"
              )

              Start-Process -FilePath $chrome `
                  -ArgumentList $arguments

              Write-Log "Chrome launch submitted."

          }
          catch {
              Write-Log "ERROR: $($_.Exception.Message)"
              throw
          }
          '@

          [System.IO.File]::WriteAllText(
              $scriptFile,
              $launcher,
              [System.Text.UTF8Encoding]::new($false)
          )

          # Windows machine-level logon startup.
          $runPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run'

          $powershell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"

          $command = "`"$powershell`" -NoProfile -WindowStyle Hidden -ExecutionPolicy Bypass -File `"$scriptFile`""

          New-ItemProperty -Path $runPath `
              -Name 'RDPChromeAutoStart' `
              -PropertyType String `
              -Value $command `
              -Force | Out-Null

          # Remove old scheduled-task launcher.
          Unregister-ScheduledTask `
              -TaskName 'RDP-Chrome-AutoStart' `
              -Confirm:$false `
              -ErrorAction SilentlyContinue

          Write-Host "Chrome startup configured."
          Write-Host "Website count: $($validated.Count)"
          Write-Host "Chrome executable: $chrome"

          foreach ($url in $validated) {
              Write-Host "Configured: $(([Uri]$url).Host)"
          }

      # --------------------------------------------------
      # 5. INSTALL UBLOCK ORIGIN LITE FOR CHROME
      #    AND UBLOCK ORIGIN FOR FIREFOX
      # --------------------------------------------------
      - name: Preinstall uBlock Origin
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'

          # Chrome: official uBlock Origin Lite.
          $chromeExtId = 'ddkjiahejlhfcafbddmgiahcphecmpfh'
          $chromeUpdate = 'https://clients2.google.com/service/update2/crx'

          $chromeKey = 'HKLM:\SOFTWARE\Policies\Google\Chrome\ExtensionInstallForcelist'

          New-Item -Path $chromeKey -Force | Out-Null

          New-ItemProperty -Path $chromeKey `
              -Name '1' `
              -PropertyType String `
              -Value "$chromeExtId;$chromeUpdate" `
              -Force | Out-Null

          Write-Host "Chrome uBlock Origin Lite policy configured."

          # Firefox: official uBlock Origin.
          $ffDir = @(
              "$env:ProgramFiles\Mozilla Firefox",
              "${env:ProgramFiles(x86)}\Mozilla Firefox"
          ) | Where-Object {
              Test-Path "$_\firefox.exe"
          } | Select-Object -First 1

          if ($ffDir) {
              $distDir = Join-Path $ffDir 'distribution'

              New-Item -Path $distDir -ItemType Directory -Force |
                  Out-Null

              $policy = @{
                  policies = @{
                      ExtensionSettings = @{
                          'uBlock0@raymondhill.net' = @{
                              installation_mode = 'force_installed'
                              install_url = 'https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi'
                              private_browsing = $true
                          }
                      }
                  }
              } | ConvertTo-Json -Depth 10

              [System.IO.File]::WriteAllText(
                  (Join-Path $distDir 'policies.json'),
                  $policy,
                  [System.Text.UTF8Encoding]::new($false)
              )

              Write-Host "Firefox uBlock Origin policy configured."
          }
          else {
              Write-Host "Firefox not found. Skipping."
          }

      # --------------------------------------------------
      # 6. INSTALL TAILSCALE
      # --------------------------------------------------
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          $installer = Join-Path $env:RUNNER_TEMP 'tailscale.msi'

          try {
              Invoke-WebRequest -Uri $url -OutFile $installer

              # Verify digital signature.
              $sig = Get-AuthenticodeSignature -FilePath $installer

              if ($sig.Status -ne 'Valid' -or
                  $sig.SignerCertificate.Subject -notlike '*Tailscale*') {
                  throw "Tailscale installer signature verification failed."
              }

              $process = Start-Process msiexec.exe `
                  -ArgumentList @(
                      '/i',
                      "`"$installer`"",
                      '/quiet',
                      '/norestart'
                  ) `
                  -Wait -PassThru

              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale installation failed: $($process.ExitCode)"
              }
          }
          finally {
              Remove-Item $installer -Force `
                  -ErrorAction SilentlyContinue
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              throw "Tailscale executable not found."
          }

          Write-Host "Tailscale installed."

      # --------------------------------------------------
      # 7. ESTABLISH TAILSCALE CONNECTION
      # --------------------------------------------------
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          Write-Host "::add-mask::$($env:TS_AUTHKEY)"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $keyFile = Join-Path $env:RUNNER_TEMP 'ts-authkey.txt'

          try {
              [System.IO.File]::WriteAllText(
                  $keyFile,
                  $env:TS_AUTHKEY.Trim()
              )

              icacls $keyFile /inheritance:r `
                  /grant:r "$($env:USERNAME):(R)" | Out-Null

              Set-Service -Name Tailscale -StartupType Automatic
              Start-Service -Name Tailscale

              Start-Sleep -Seconds 5

              # Use protected file instead of command-line secret.
              & $ts up `
                  "--auth-key=file:$keyFile" `
                  "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
                  "--unattended" `
                  "--timeout=60s" 2>&1 | Out-Null

              if ($LASTEXITCODE -ne 0) {
                  throw "Tailscale connection failed."
              }
          }
          finally {
              Remove-Item $keyFile -Force `
                  -ErrorAction SilentlyContinue

              Remove-Item Env:\TS_AUTHKEY `
                  -ErrorAction SilentlyContinue
          }

          # Wait for Tailscale IPv4 address.
          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $output = & $ts ip -4

              if ($LASTEXITCODE -eq 0 -and $output) {
                  $tsIP = "$($output | Select-Object -First 1)".Trim()

                  if ($tsIP) {
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected."
          Write-Host "Tailscale IP: $tsIP"

      # --------------------------------------------------
      # 8. VERIFY RDP LISTENER
      # --------------------------------------------------
      - name: Verify Local RDP Listener
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          $listening = $false

          do {
              $listener = Get-NetTCPConnection `
                  -State Listen `
                  -LocalPort 3389 `
                  -ErrorAction SilentlyContinue

              if ($listener) {
                  $listening = $true
                  break
              }

              Start-Sleep -Seconds 5

          } while ((Get-Date) -lt $deadline)

          if (-not $listening) {
              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP listener is active."

      # --------------------------------------------------
      # 9. DISPLAY RDP DETAILS AND KEEP RUNNING
      # --------------------------------------------------
      - name: Maintain Connection Until Deadline
        shell: pwsh
        run: |
          $stopAt = [DateTimeOffset]::Parse($env:RDP_STOP_UTC)

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Use GitHub RDP_PASSWORD secret"
          Write-Host "Administrator: Enabled"
          Write-Host "Chrome: Automatic startup enabled"
          Write-Host "Automatic stop UTC: $($stopAt.ToString('u'))"
          Write-Host "================================"

          while ([DateTimeOffset]::UtcNow -lt $stopAt) {
              $remaining = $stopAt - [DateTimeOffset]::UtcNow

              Write-Host "RDP active. Remaining: $($remaining.ToString('hh\:mm\:ss'))"

              $sleepSeconds = [Math]::Min(
                  60,
                  [Math]::Max(1, [Math]::Ceiling($remaining.TotalSeconds))
              )

              Start-Sleep -Seconds $sleepSeconds
          }

          Write-Host "Selected runtime reached. Ending workflow."

      # --------------------------------------------------
      # 10. AUTOMATIC CLEANUP
      # --------------------------------------------------
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host "Starting cleanup."

          # Remove temporary authentication material.
          Remove-Item `
              (Join-Path $env:RUNNER_TEMP 'ts-authkey.txt') `
              -Force -ErrorAction SilentlyContinue

          # Disconnect Tailscale.
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (Test-Path $ts) {
              & $ts logout 2>&1 | Out-Null
          }

          # Remove firewall access rule.
          Get-NetFirewallRule `
              -DisplayName 'RDP-Tailscale' `
              -ErrorAction SilentlyContinue |
              Remove-NetFirewallRule

          # Disable RDP.
          Set-ItemProperty `
              -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
              -Name fDenyTSConnections `
              -Value 1 -Force

          # Remove Chrome startup registry entry.
          Remove-ItemProperty `
              -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' `
              -Name 'RDPChromeAutoStart' `
              -ErrorAction SilentlyContinue

          # Remove RDP Chrome configuration.
          Remove-Item `
              "$env:ProgramData\RDPChrome" `
              -Recurse -Force `
              -ErrorAction SilentlyContinue

          # Remove temporary RDP account.
          if (Get-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name 'RDP'
          }

          Write-Host "Cleanup complete."
