
name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "RDP runtime in hours"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:
      - name: Set Runtime Deadline
        shell: pwsh
        run: |
          $hours = 0

          if (-not [int]::TryParse($env:RDP_HOURS, [ref]$hours) -or
              $hours -lt 1 -or $hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          $deadline = [DateTimeOffset]::UtcNow.AddHours($hours)

          "RDP_STOP_UTC=$($deadline.ToString('o'))" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Runtime: $hours hour(s)"
          Write-Host "Deadline UTC: $($deadline.ToString('o'))"

      - name: Configure Windows RDP
        shell: pwsh
        run: |
          $tsRange = '100.64.0.0/10'

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress $tsRange `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP configured with NLA enabled."

      - name: Configure RDP Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePassword
          } else {
              New-LocalUser `
                -Name 'RDP' `
                -Password $securePassword `
                -AccountNeverExpires | Out-Null
          }

          $group = Get-LocalGroup -SID 'S-1-5-32-555'
          $members = Get-LocalGroupMember -Group $group.Name `
            -ErrorAction SilentlyContinue

          if (-not ($members | Where-Object {
              $_.Name -match '\\RDP$' -or $_.Name -eq 'RDP'
          })) {
              Add-LocalGroupMember -Group $group.Name -Member 'RDP'
          }

          Write-Host "RDP account is ready."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          try {
              $process = Start-Process msiexec.exe `
                -ArgumentList @('/i', "`"$installer`"", '/quiet', '/norestart') `
                -Wait -PassThru

              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale installation failed: $($process.ExitCode)"
              }
          }
          finally {
              Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing or unavailable."
          }

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              throw "Tailscale executable not found: $ts"
          }

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $output = & $ts ip -4

              if ($LASTEXITCODE -eq 0 -and $output) {
                  $tsIP = "$($output | Select-Object -First 1)".Trim()
                  if ($tsIP) { break }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP: $tsIP"

      - name: Verify Local RDP Listener
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          $listening = $false

          do {
              $listener = Get-NetTCPConnection `
                -State Listen -LocalPort 3389 `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  $listening = $true
                  break
              }

              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $listening) {
              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "Local RDP listener is active."

      - name: Maintain RDP Until Deadline
        shell: pwsh
        run: |
          $stopAt = [DateTimeOffset]::Parse(
              $env:RDP_STOP_UTC
          )

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: The value configured in RDP_PASSWORD"
          Write-Host "Automatic stop UTC: $($stopAt.ToString('u'))"
          Write-Host "================================"

          while ([DateTimeOffset]::UtcNow -lt $stopAt) {
              $remaining = $stopAt - [DateTimeOffset]::UtcNow

              Write-Host "RDP active. Remaining: $($remaining.ToString('hh\:mm\:ss'))"

              $seconds = [Math]::Min(
                  60,
                  [Math]::Max(1, [Math]::Ceiling($remaining.TotalSeconds))
              )

              Start-Sleep -Seconds $seconds
          }

          Write-Host "Configured runtime reached. Finishing workflow."
