name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should the session run?"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:
      - name: Set Runtime Deadline
        shell: pwsh
        run: |
          $hours = 0

          if (-not [int]::TryParse($env:RDP_HOURS, [ref]$hours) -or
              $hours -lt 1 -or $hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          $deadline = [DateTimeOffset]::UtcNow.AddHours($hours)

          "RDP_STOP_UTC=$($deadline.ToString('o'))" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Runtime: $hours hour(s)"
          Write-Host "Deadline UTC: $($deadline.ToString('u'))"

      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2 -Force

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any

          Set-Service -Name TermService -StartupType Manual
          Start-Service -Name TermService

          Write-Host "RDP settings configured."

      - name: Create RDP User and Assign Groups
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD secret is missing."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name 'RDP' `
            -ErrorAction SilentlyContinue

          if ($user) {
              Set-LocalUser -Name 'RDP' -Password $securePassword
          } else {
              New-LocalUser `
                -Name 'RDP' `
                -Password $securePassword `
                -AccountNeverExpires | Out-Null
          }

          $user = Get-LocalUser -Name 'RDP'
          $userSid = $user.SID.Value

          # Add RDP to the local Administrators group.
          $adminGroup = Get-LocalGroup -SID 'S-1-5-32-544'
          $adminMembers = Get-LocalGroupMember `
            -Group $adminGroup.Name -ErrorAction Stop

          $isAdmin = $false

          foreach ($member in $adminMembers) {
              if ($member.SID -and $member.SID.Value -eq $userSid) {
                  $isAdmin = $true
                  break
              }
          }

          if (-not $isAdmin) {
              Add-LocalGroupMember `
                -Group $adminGroup.Name -Member $user.Name
          }

          # Add RDP to the Remote Desktop Users group.
          $rdpGroup = Get-LocalGroup -SID 'S-1-5-32-555'
          $rdpMembers = Get-LocalGroupMember `
            -Group $rdpGroup.Name -ErrorAction Stop

          $canRdp = $false

          foreach ($member in $rdpMembers) {
              if ($member.SID -and $member.SID.Value -eq $userSid) {
                  $canRdp = $true
                  break
              }
          }

          if (-not $canRdp) {
              Add-LocalGroupMember `
                -Group $rdpGroup.Name -Member $user.Name
          }

          # Verify membership.
          $adminMembers = Get-LocalGroupMember -Group $adminGroup.Name
          $verifiedAdmin = @($adminMembers | Where-Object {
              $_.SID -and $_.SID.Value -eq $userSid
          }).Count -gt 0

          if (-not $verifiedAdmin) {
              throw "RDP was not added to Administrators."
          }

          Write-Host "RDP user created and group membership verified."
          Write-Host "Administrator membership: confirmed."
          Write-Host "Remote Desktop membership: confirmed."

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi'
          $installer = Join-Path $env:TEMP 'tailscale.msi'

          Invoke-WebRequest -Uri $url -OutFile $installer

          try {
              $process = Start-Process msiexec.exe `
                -ArgumentList @('/i', "`"$installer`"", '/quiet', '/norestart') `
                -Wait -PassThru

              if ($process.ExitCode -notin @(0, 3010)) {
                  throw "Tailscale installation failed: $($process.ExitCode)"
              }
          }
          finally {
              Remove-Item $installer -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path "$env:ProgramFiles\Tailscale\tailscale.exe")) {
              throw "Tailscale executable not found."
          }

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          & $ts up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed. Check the auth key and tailnet configuration."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $output = & $ts ip -4

              if ($LASTEXITCODE -eq 0 -and $output) {
                  $tsIP = "$($output | Select-Object -First 1)".Trim()
                  if ($tsIP) { break }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale IP was not assigned."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale IP assigned successfully."

      - name: Verify Local RDP Listener
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddMinutes(2)
          $listening = $false

          do {
              $listener = Get-NetTCPConnection `
                -State Listen -LocalPort 3389 `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  $listening = $true
                  break
              }

              Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)

          if (-not $listening) {
              throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "Local RDP listener is active."

      - name: Maintain Connection Until Deadline
        shell: pwsh
        run: |
          $stopAt = [DateTimeOffset]::Parse($env:RDP_STOP_UTC)

          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: Use the RDP_PASSWORD GitHub secret"
          Write-Host "Automatic stop UTC: $($stopAt.ToString('u'))"
          Write-Host "================================"

          while ([DateTimeOffset]::UtcNow -lt $stopAt) {
              $remaining = $stopAt - [DateTimeOffset]::UtcNow

              Write-Host "RDP active. Remaining: $($remaining.ToString('hh\:mm\:ss'))"

              $sleepSeconds = [Math]::Min(
                  60,
                  [Math]::Max(1, [Math]::Ceiling($remaining.TotalSeconds))
              )

              Start-Sleep -Seconds $sleepSeconds
          }

          Write-Host "Selected runtime reached. Ending workflow."

