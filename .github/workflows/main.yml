name: Windows RDP - Tailscale + Single-Tab Website Dashboard

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: "How long should the RDP session remain available?"
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
        default: "3"

permissions:
  contents: read

concurrency:
  group: windows-rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rdp:
    name: Start Windows Server 2025 RDP
    runs-on: windows-2025
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      CHROME_URLS: ${{ secrets.CHROME_URLS }}
      SESSION_HOURS: ${{ inputs.session_hours }}

    steps:
      - name: Validate required secrets and duration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw 'Missing GitHub secret: RDP_PASSWORD'
          }
          if ($env:RDP_PASSWORD.Length -lt 14) {
            throw 'RDP_PASSWORD must be at least 14 characters.'
          }
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw 'Missing GitHub secret: TAILSCALE_AUTH_KEY'
          }
          if ([string]::IsNullOrWhiteSpace($env:CHROME_URLS)) {
            throw 'Missing GitHub secret: CHROME_URLS'
          }
          if ($env:SESSION_HOURS -notin @('1','2','3','4','5')) {
            throw 'Invalid session duration.'
          }

          Write-Host "Requested session duration: $env:SESSION_HOURS hour(s)."
          Write-Host 'Required secrets are present.'

      - name: Configure RDP administrator account and secure firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name $env:RDP_USERNAME -ErrorAction SilentlyContinue
          if ($null -eq $user) {
            New-LocalUser -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -Description 'Temporary RDP administrator account' `
              -PasswordNeverExpires `
              -AccountNeverExpires | Out-Null
          } else {
            Set-LocalUser -Name $env:RDP_USERNAME `
              -Password $securePassword `
              -PasswordNeverExpires $true
            Enable-LocalUser -Name $env:RDP_USERNAME
          }

          Add-LocalGroupMember -Group 'Administrators' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member $env:RDP_USERNAME -ErrorAction SilentlyContinue

          # Enable RDP but keep Network Level Authentication enabled.
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          # Disable broad built-in RDP firewall rules. A Tailscale-interface-only
          # rule is created after Tailscale has connected.
          Get-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Write-Host 'RDP administrator account configured; NLA remains enabled.'

      - name: Install Google Chrome
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Join-Path $env:TEMP 'chrome-enterprise-x64.msi'
          $uri = 'https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi'

          Invoke-WebRequest -Uri $uri -OutFile $installer
          $proc = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$installer`"", '/qn', '/norestart') `
            -Wait -PassThru

          if ($proc.ExitCode -notin @(0,3010)) {
            throw "Chrome installation failed with exit code $($proc.ExitCode)."
          }

          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          if (-not (Test-Path $chrome)) {
            throw 'Chrome installation completed but chrome.exe was not found.'
          }

          Write-Host "Chrome installed: $chrome"

      - name: Install and connect Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $msi = Join-Path $env:TEMP 'tailscale-setup.msi'
          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' `
            -OutFile $msi

          $install = Start-Process msiexec.exe `
            -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') `
            -Wait -PassThru

          if ($install.ExitCode -notin @(0,3010)) {
            throw "Tailscale installation failed: $($install.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
            throw 'Tailscale executable not found after installation.'
          }

          & $tailscale up "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
            throw "tailscale up failed with exit code $LASTEXITCODE"
          }

          $ip = $null
          for ($i = 0; $i -lt 60; $i++) {
            $ip = (& $tailscale ip -4 2>$null | Select-Object -First 1)
            if ($ip -match '^100\.(?:6[4-9]|[7-9]\d|1[01]\d|12[0-7])\.') {
              break
            }
            Start-Sleep -Seconds 2
          }

          if (-not $ip) {
            throw 'Tailscale did not provide an IPv4 address.'
          }

          "TAILSCALE_IP=$ip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Tailscale IPv4: $ip"

          # Restrict inbound RDP to the Tailscale adapter and Tailscale CGNAT range.
          $adapter = Get-NetAdapter |
            Where-Object {
              $_.Status -eq 'Up' -and
              ($_.Name -match 'Tailscale' -or $_.InterfaceDescription -match 'Tailscale')
            } |
            Select-Object -First 1

          if (-not $adapter) {
            Get-NetAdapter | Format-Table -AutoSize | Out-String | Write-Host
            throw 'Tailscale network adapter not found.'
          }

          New-NetFirewallRule `
            -DisplayName 'RDP over Tailscale only' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -InterfaceAlias $adapter.Name `
            -Profile Any | Out-Null

          Write-Host "RDP firewall restricted to Tailscale adapter: $($adapter.Name)"

      - name: Configure single-tab website dashboard and RDP logon startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $base = 'C:\ProgramData\RDPChrome'
          New-Item -Path $base -ItemType Directory -Force | Out-Null

          # CHROME_URLS must be a JSON array of URL strings.
          try {
            $parsed = ConvertFrom-Json -InputObject $env:CHROME_URLS -AsHashtable -ErrorAction Stop
          } catch {
            throw "CHROME_URLS is not valid JSON: $($_.Exception.Message)"
          }

          $script:urls = [System.Collections.Generic.List[string]]::new()

          function Add-Urls($node) {
            if ($node -is [string]) {
              $value = $node.Trim()
              $uri = $null
              if (-not [Uri]::TryCreate($value, [UriKind]::Absolute, [ref]$uri) -or
                  $uri.Scheme -notin @('http','https') -or
                  [string]::IsNullOrWhiteSpace($uri.Host)) {
                throw "Invalid website URL: $value"
              }
              $script:urls.Add($uri.AbsoluteUri)
              return
            }

            if ($node -is [System.Array] -or
                $node -is [System.Collections.IList]) {
              foreach ($child in $node) { Add-Urls $child }
              return
            }

            throw "CHROME_URLS contains unsupported JSON type: $($node.GetType().FullName)"
          }

          Add-Urls $parsed

          if ($script:urls.Count -eq 0) {
            throw 'CHROME_URLS contains no website URLs.'
          }

          # Store canonical, flat JSON for audit/debugging.
          $canonicalJson = ConvertTo-Json -InputObject $script:urls.ToArray() -Depth 5
          [System.IO.File]::WriteAllText(
            (Join-Path $base 'websites.json'),
            $canonicalJson,
            [System.Text.UTF8Encoding]::new($false)
          )

          # Base64 avoids unsafe interpolation of URLs into the HTML source.
          $urlsBase64 = [Convert]::ToBase64String(
            [System.Text.Encoding]::UTF8.GetBytes(
              (ConvertTo-Json -InputObject $script:urls.ToArray() -Compress)
            )
          )

          $html = @'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>RDP Website Workspace</title>
            <style>
              *{box-sizing:border-box}
              html,body{height:100%;margin:0;background:#10131a;color:#e8edf7;font:14px Segoe UI,Arial,sans-serif}
              header{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#171d29;border-bottom:1px solid #30394a}
              header strong{font-size:14px}
              #status{color:#aab7cc;font-size:12px}
              #workspace{height:calc(100% - 46px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:7px;padding:7px}
              .panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:#fff;border:1px solid #30394a;border-radius:7px;overflow:hidden}
              .panel-title{height:31px;flex:0 0 31px;padding:7px 10px;background:#202a3a;color:#e8edf7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
              iframe{border:0;width:100%;height:100%;background:white}
              .panel:last-child:nth-child(odd){grid-column:1/-1}
              @media(max-width:900px){#workspace{grid-template-columns:1fr;grid-template-rows:none;overflow:auto}.panel{height:70vh}.panel:last-child:nth-child(odd){grid-column:auto}}
            </style>
          </head>
          <body>
            <header><strong>RDP Website Workspace</strong><span id="status">Loading websites…</span></header>
            <main id="workspace"></main>
            <script>
              const encoded = '__URLS_BASE64__';
              const urls = JSON.parse(atob(encoded));
              const workspace = document.getElementById('workspace');
              const status = document.getElementById('status');
              urls.forEach((url, index) => {
                const panel = document.createElement('section');
                panel.className = 'panel';
                const title = document.createElement('div');
                title.className = 'panel-title';
                title.textContent = new URL(url).hostname;
                const frame = document.createElement('iframe');
                frame.src = url;
                frame.title = new URL(url).hostname;
                frame.loading = index < 2 ? 'eager' : 'lazy';
                frame.referrerPolicy = 'strict-origin-when-cross-origin';
                panel.append(title, frame);
                workspace.append(panel);
              });
              status.textContent = `${urls.length} website panel(s)`;
            </script>
          </body>
          </html>
          '@

          $html = $html.Replace('__URLS_BASE64__', $urlsBase64)
          [System.IO.File]::WriteAllText(
            (Join-Path $base 'dashboard.html'),
            $html,
            [System.Text.UTF8Encoding]::new($false)
          )

          # Launcher runs in the interactive RDP user's desktop session.
          $launcher = @'
          $ErrorActionPreference = 'Stop'
          $logDir = Join-Path $env:LOCALAPPDATA 'RDPChrome'
          New-Item -Path $logDir -ItemType Directory -Force | Out-Null
          $log = Join-Path $logDir 'launcher.log'

          function Log($message) {
            Add-Content -LiteralPath $log -Value "$(Get-Date -Format o) $message"
          }

          try {
            Log "Interactive logon startup. User=$env:USERNAME"

            $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
            if (-not (Test-Path $chrome)) {
              $chrome = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe"
            }
            if (-not (Test-Path $chrome)) {
              throw 'Chrome executable not found.'
            }

            $dashboard = 'C:\ProgramData\RDPChrome\dashboard.html'
            if (-not (Test-Path $dashboard)) {
              throw 'Dashboard file not found.'
            }

            $profile = Join-Path $env:LOCALAPPDATA 'RDPChromeProfile'
            New-Item -Path $profile -ItemType Directory -Force | Out-Null

            $dashboardUrl = ([Uri]$dashboard).AbsoluteUri
            $chromeArgs = @(
              '--new-window',
              '--no-first-run',
              '--no-default-browser-check',
              "--user-data-dir=`"$profile`"",
              "`"$dashboardUrl`""
            )

            Start-Sleep -Seconds 5
            Start-Process -FilePath $chrome -ArgumentList ($chromeArgs -join ' ')
            Log "Chrome dashboard launch submitted: $dashboardUrl"
          }
          catch {
            Log "ERROR: $($_.Exception.Message)"
            exit 1
          }
          '@

          $launcherPath = Join-Path $base 'LaunchChrome.ps1'
          [System.IO.File]::WriteAllText(
            $launcherPath,
            $launcher,
            [System.Text.UTF8Encoding]::new($false)
          )

          # Register a per-user interactive logon task. It runs only after RDP
          # user logon, so Chrome is visible in that user's desktop session.
          $pwsh = (Get-Command pwsh.exe -ErrorAction Stop).Source
          $action = New-ScheduledTaskAction `
            -Execute $pwsh `
            -Argument "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$launcherPath`""

          $trigger = New-ScheduledTaskTrigger -AtLogOn -User "$env:COMPUTERNAME\$env:RDP_USERNAME"
          $principal = New-ScheduledTaskPrincipal `
            -UserId "$env:COMPUTERNAME\$env:RDP_USERNAME" `
            -LogonType Interactive `
            -RunLevel Highest

          Register-ScheduledTask `
            -TaskName 'RDPChromeDashboard' `
            -Action $action `
            -Trigger $trigger `
            -Principal $principal `
            -Description 'Open the configured website dashboard after RDP logon.' `
            -Force | Out-Null

          Write-Host "Configured $($script:urls.Count) website panel(s) in one Chrome tab."
          Write-Host 'RDPChromeDashboard logon task registered.'

      - name: Verify RDP listener and print connection details
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $listener = $false
          for ($i = 0; $i -lt 30; $i++) {
            $listener = Test-NetConnection -ComputerName 127.0.0.1 -Port 3389 -InformationLevel Quiet
            if ($listener) { break }
            Start-Sleep -Seconds 2
          }

          if (-not $listener) {
            throw 'RDP TCP listener did not become available on port 3389.'
          }

          Write-Host ''
          Write-Host '========== RDP READY ==========' -ForegroundColor Green
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host 'RDP port: 3389'
          Write-Host 'Username: RDP'
          Write-Host 'Password: use the RDP_PASSWORD GitHub secret'
          Write-Host 'Chrome: one dashboard tab containing all configured website panels'
          Write-Host '===============================' -ForegroundColor Green

      - name: Keep RDP session available for selected duration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $hours = [int]$env:SESSION_HOURS
          $deadline = (Get-Date).AddHours($hours)

          Write-Host "RDP session will remain available until $deadline."

          while ((Get-Date) -lt $deadline) {
            $remaining = [int][Math]::Ceiling(($deadline - (Get-Date)).TotalSeconds)
            Write-Host "Session active. Approximately $([Math]::Ceiling($remaining / 60)) minute(s) remaining."
            Start-Sleep -Seconds ([Math]::Min(60, [Math]::Max(1, $remaining)))
          }

          Write-Host 'Requested RDP session duration completed.'

      - name: Cleanup temporary RDP resources
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          Write-Host 'Starting cleanup.'

          # Disconnect Tailscale.
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (Test-Path $tailscale) {
            & $tailscale down
          }

          # Remove only the workflow-created firewall rule.
          Remove-NetFirewallRule -DisplayName 'RDP over Tailscale only' -ErrorAction SilentlyContinue

          # Disable RDP on this ephemeral runner.
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 1 -ErrorAction SilentlyContinue

          # Remove the scheduled task and temporary account.
          Unregister-ScheduledTask -TaskName 'RDPChromeDashboard' -Confirm:$false -ErrorAction SilentlyContinue

          Remove-LocalGroupMember -Group 'Administrators' -Member 'RDP' -ErrorAction SilentlyContinue
          Remove-LocalGroupMember -Group 'Remote Desktop Users' -Member 'RDP' -ErrorAction SilentlyContinue
          Remove-LocalUser -Name 'RDP' -ErrorAction SilentlyContinue

          # Remove workflow-created website and launcher files.
          Remove-Item 'C:\ProgramData\RDPChrome' -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host 'Cleanup completed. The GitHub-hosted runner will be discarded.'
