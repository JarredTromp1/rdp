name: RDP

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "How many hours should the session run?"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_HOURS: ${{ inputs.hours }}

    steps:
      - name: Set Runtime Deadline
        shell: pwsh
        run: |
          $hours = 0

          if (-not [int]::TryParse($env:RDP_HOURS, [ref]$hours) -or
              $hours -lt 1 -or$hours -gt 5) {
              throw "Runtime must be between 1 and 5 hours."
          }

          $deadline = [DateTimeOffset]::UtcNow.AddHours($hours)

          "RDP_STOP_UTC=$($deadline.ToString('o'))" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Runtime: $hours hour(s)"
          Write-Host "Deadline UTC: $($deadline.ToString('u'))"

      - name: Configure Core RDP & Admin UAC Settings
        shell: pwsh
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1 -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer -Value 2 -Force

          # Disable UAC prompts so the RDP admin user can install software without blocks
          Set-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
            -Name ConsentPromptBehaviorAdmin -Value 0 -Force

          Set-ItemProperty `
            -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' `
            -Name EnableLUA -Value 0 -Force

          Get-NetFirewallRule -DisplayName 'RDP-Tailscale*' `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName 'RDP-Tailscale-TCP' `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress '100.64.0.0/10' `
            -Profile Any | Out-Null

          New-NetFirewall
